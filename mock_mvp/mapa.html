<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CicloAlerta · Mapa</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --critico:#c62828; --atencao:#ef6c00; --fundo:#fafafa; --texto:#1a1a1a; }
  body { margin:0; font:16px/1.4 system-ui, sans-serif; background:var(--fundo); color:var(--texto); }
  header { padding:10px 16px; display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
  h1 { font-size:20px; margin:0; }
  #faixa { display:none; padding:12px 16px; color:#fff; font-weight:600; }
  #faixa.critico { display:block; background:var(--critico); }
  #faixa.atencao { display:block; background:var(--atencao); }
  #mapa { height:calc(100vh - 110px); }
  .legenda { font-size:14px; color:#555; }
</style>
</head>
<body>
<header><h1>CicloAlerta</h1><span class="legenda" id="resumo">carregando…</span></header>
<div id="faixa" role="alert" aria-live="polite"></div>
<div id="mapa" aria-label="Mapa de perigos nas ciclovias"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const mapa = L.map('mapa').setView([-23.572, -46.672], 14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '© OpenStreetMap'}).addTo(mapa);
const camada = L.layerGroup().addTo(mapa);
const cor = {alta: '#c62828', media: '#ef6c00', baixa: '#2e7d32'};

async function atualizar() {
  const [relatos, alertas] = await Promise.all([
    fetch('/api/relatos').then(r => r.json()),
    fetch('/api/alertas').then(r => r.json())]);
  camada.clearLayers();
  const comAlerta = new Map(alertas.map(a => [a.relato_id, a]));
  for (const r of relatos) {
    if (typeof r.lat !== 'number' || typeof r.lon !== 'number') continue;
    const a = comAlerta.get(r.id);
    L.circleMarker([r.lat, r.lon], {radius: 7, color: cor[r.severidade] || '#666', fillOpacity: .8})
      .bindPopup(`<b>${r.tipo}</b> · severidade ${r.severidade}<br>origem: ${r.origem}` +
                 (a ? `<br><b>ALERTA ${a.nivel.toUpperCase()}</b>: ${a.chuva_mm} mm de chuva previstos` : ''))
      .addTo(camada);
    if (a) L.circleMarker([r.lat, r.lon], {radius: 16, color: a.nivel === 'critico' ? '#c62828' : '#ef6c00', fill: false, weight: 3}).addTo(camada);
  }
  const crit = alertas.filter(a => a.nivel === 'critico').length, at = alertas.length - crit;
  const faixa = document.getElementById('faixa');
  faixa.className = crit ? 'critico' : (at ? 'atencao' : '');
  faixa.textContent = crit ? `Chuva prevista: ${crit} trecho(s) crítico(s) na sua região. Reduza a velocidade.`
                            : (at ? `Chuva prevista: ${at} trecho(s) pedem atenção.` : '');
  document.getElementById('resumo').textContent = `${relatos.length} relatos · ${alertas.length} alertas ativos`;
}
atualizar(); setInterval(atualizar, 15000);
</script>
</body>
</html>
